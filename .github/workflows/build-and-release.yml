name: Build, sign, and release Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: signing-spike
  PUBLIC_IMAGE_NAME: ghcr.io/evansd/signing-spike
  TARGET_TAG: production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push Docker image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.get_digest.outputs.digest }}
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Build image
      id: build
      run: docker build --tag "$IMAGE_NAME" .
        
    - name: Docker login
      run: |
        echo ${{ secrets.GITHUB_TOKEN }} | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

    - name: Push image
      env:
        # We need a label for the image to avoid implicitly updating `latest` but it
        # doesn't much matter what it is (it doesn't need to be unique)
        IMAGE_LABEL: ${{ github.sha }}
      run: |
        docker tag "$IMAGE_NAME" "$PUBLIC_IMAGE_NAME:$IMAGE_LABEL"
        docker push "$PUBLIC_IMAGE_NAME:$IMAGE_LABEL"

    - name: Get image digest
      id: get_digest
      # If we used `docker/build-push-action` it would get the digest for us, but we
      # want to invoke the build process ourself so we can e.g. use our `just` tooling
      run: |
        set -euo pipefail

        REPO_DIGESTS="$(
          docker inspect --format="{{join .RepoDigests \"\n\"}}" "$IMAGE_NAME"
        )"

        readarray -t MATCHING_DIGESTS < <(
          grep --fixed-strings -- "${PUBLIC_IMAGE_NAME}@" <<< "$REPO_DIGESTS" || true
        )

        if (( ${#MATCHING_DIGESTS[@]} != 1 )); then
          echo "Expected exactly one matching digest for $PUBLIC_IMAGE_NAME"
          echo "REPO_DIGESTS: $REPO_DIGESTS"
          echo "MATCHING_DIGESTS: $MATCHING_DIGESTS[*]"
          exit 1
        fi

        # Extract the substring after the final "@"
        echo "digest=${MATCHING_DIGESTS[0]##*@}" >> "$GITHUB_OUTPUT"

  attest:
    name: Generate build provenance attestations
    needs: build-and-push
    permissions:
      packages: write
      id-token: write
      attestations: write    
    runs-on: ubuntu-24.04
    steps:

    - name: Docker login
      run: |
        echo ${{ secrets.GITHUB_TOKEN }} | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

    - name: Attest provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ env.PUBLIC_IMAGE_NAME }}
        subject-digest: ${{ needs.build-and-push.outputs.digest }}
        push-to-registry: true

  sign-and-release:
    name: Sign image and update target tag
    needs: [build-and-push, attest]
    permissions:
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    env:
      DIGEST: ${{ needs.build-and-push.outputs.digest }}
    steps:

    - name: Docker login
      run: |
        echo ${{ secrets.GITHUB_TOKEN }} | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign image
      run: |
        cosign sign --yes "${PUBLIC_IMAGE_NAME}@${DIGEST}"

    - name: Update target tag
      # This pull/push dance is required due to limitations of the Docker CLI. Tools
      # like Google's `crane` will let you just update the registry tag directly, but
      # we want to keep the tooling simple for now
      run: |
        docker pull "${PUBLIC_IMAGE_NAME}@${DIGEST}"
        docker tag "${PUBLIC_IMAGE_NAME}@${DIGEST}" "${PUBLIC_IMAGE_NAME}:${TARGET_TAG}"
        docker push "${PUBLIC_IMAGE_NAME}:${TARGET_TAG}"
